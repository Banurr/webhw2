version: '3.8'

services:
    backend:
        image: banurr/webhw2:latest
        container_name: kase-backend
        env_file:
            - .env
        ports:
            - "8080:8080"
        depends_on:
            - database
        environment:
            - DB_URL=${DB_URL}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
        networks:
            - kase

    database:
        image: 'postgres'
        container_name: kase-database
        env_file:
            - .env
        environment:
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - kase


volumes:
    pgdata:

networks:
    kase:
        driver: bridge
